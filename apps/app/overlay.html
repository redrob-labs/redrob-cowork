<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Redrob Cowork Overlay</title>
    <script>
      (function () {
        try {
          // The key theme.ts writes, then the legacy one it migrates from, so the
          // first paint is the theme the app is about to apply rather than a flash
          // of the other one on the design system's white or Redrob Black page.
          var stored = localStorage.getItem("redrob.react.settings.theme-mode") || localStorage.getItem("redrob.themePref");
          var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body class="overflow-hidden bg-transparent text-dls-text">
    <div id="root"></div>
    <script type="module" src="/src/overlay/index.tsx"></script>
  </body>
</html>
