extends: ./electron-builder.base.yml
appId: io.redrob.work
productName: Redrob Cowork
protocols:
  - name: Redrob Cowork
    schemes:
      - redrob
linux:
  executableName: redrob
# <stem>-<version>-<os>-<arch>.<ext>, the order Redrob Launcher parses. electron-builder's
# ${os}/${arch} are its own tokens (mac/win, x64/arm64); scripts/release/launcher-asset-names.mjs
# maps them to the launcher's (macos/windows, x86_64/aarch64, -portable for a Windows zip)
# right after packaging and rewrites latest*.yml to match.
artifactName: redrob-cowork-${version}-${os}-${arch}.${ext}
# The launcher recognises a Windows installer only by the `-setup.exe` suffix, so the NSIS
# target carries the marker from the packager on (the rename step keeps it in place).
nsis:
  artifactName: redrob-cowork-${version}-${os}-${arch}-setup.${ext}
