extends: ./electron-builder.base.yml
appId: io.redrob.work
productName: Redrob Work Cloud
extraMetadata:
  openworkDistribution: cloud
protocols:
  - name: Redrob Work Cloud
    schemes:
      - redrob
publish:
  - provider: github
    owner: different-ai
    repo: openwork
    releaseType: release
    channel: cloud
linux:
  executableName: redrob-cloud
artifactName: redrob-cloud-${os}-${arch}-${version}.${ext}
