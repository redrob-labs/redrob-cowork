directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
  # onnxruntime-node carries native binaries for six platforms (about 245 MB); keep the one built for.
  - "!node_modules/onnxruntime-node/bin/**"
  - "node_modules/onnxruntime-node/bin/napi-v6/${platform}/${arch}/**"
  - from: .electron-runtime/node_modules
    to: node_modules
extraResources:
  - from: .electron-runtime/redrob-sentry.json
    to: redrob-sentry.json
  - from: ../app/dist
    to: app-dist
  # The privacy detection model redrob-server loads at High and Strict, pinned by manifest hash.
  # scripts/prepare-privacy-model.mjs fetches and verifies the weights before packaging.
  - from: resources/privacy-model
    to: privacy-model
    filter:
      - manifest.json
      - "*.onnx"
      - tokenizer.json
      - NOTICE.md
  # The work classifier's encoder, pinned the same way; scripts/prepare-insights-model.mjs fills it in.
  - from: resources/insights-model
    to: insights-model
    filter:
      - manifest.json
      - "*.onnx"
      - tokenizer.json
      - NOTICE.md
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
  - from: ../../packages/docs
    to: redrob-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
  # dlopen cannot read inside app.asar: the binding and the libonnxruntime beside it stay on disk.
  - node_modules/onnxruntime-node/bin/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
# This fork's own repository. The previous value still named upstream
# (different-ai/redrob), so the update metadata electron-builder writes described a
# repository this app never published to.
publish:
  - provider: github
    owner: redrob-labs
    repo: redrob-cowork
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Redrob Cowork uses the microphone when you start Voice Mode so you can speak commands to your agent.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - redrob
        - redrob-aarch64-apple-darwin
        - redrob-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "Redrob Cowork Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/linux
  syncDesktopName: true
  extraResources:
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - redrob
        - redrob-aarch64-unknown-linux-gnu
        - redrob-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  signtoolOptions:
    # electron-builder defaults `signingHashAlgorithms` to ["sha1", "sha256"] and
    # runs ONE SIGNING PASS PER ENTRY, so the default doubles every signature a
    # cloud signing service bills us for. sha1 buys nothing back: Microsoft let
    # the SHA-1 Trusted Root CA expire on 2021-05-09, so the chain a sha1
    # Authenticode signature needs is no longer publicly trusted, and the only
    # platform it ever served -- Windows 7 SP1 without the 2019 SHA-2 servicing
    # update -- cannot run this Electron version anyway.
    signingHashAlgorithms:
      - sha256
    # electron-builder signs every .exe in the package, including vendor binaries
    # we ship but do not build (elevate.exe, Microsoft's OpenConsole.exe). Cloud
    # signing services bill per signature, so this hook skips a vendor binary
    # that already carries one and delegates everything else to the built-in
    # signer. See build/sign-windows.cjs for the measurement and the tradeoff.
    sign: build/sign-windows.cjs
  extraResources:
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/sidecars
      to: sidecars
      filter:
        - redrob.bin
        - redrob-aarch64-pc-windows-msvc.bin
        - redrob-x86_64-pc-windows-msvc.bin
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.bin
        - versions.json-x86_64-pc-windows-msvc.bin
  target:
    - nsis
nsis:
  include: build/installer.nsh
  # electron-builder defaults to a one-click installer that starts writing the
  # moment it opens, with no destination and no confirmation. Redrob Office ships
  # the assisted installer, and an app that installs itself before the user has
  # agreed to anything reads as malware rather than as a shortcut.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user by default, so no UAC prompt is needed for the common case.
  perMachine: false
