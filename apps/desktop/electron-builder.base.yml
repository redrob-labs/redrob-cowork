directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
  - from: .electron-runtime/node_modules
    to: node_modules
extraResources:
  - from: .electron-runtime/redrob-sentry.json
    to: redrob-sentry.json
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
  - from: ../../packages/docs
    to: redrob-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
# This fork's own repository. The previous value still named upstream
# (different-ai/redrob), so the update metadata electron-builder writes described a
# repository this app never published to.
publish:
  - provider: github
    owner: redrob-labs
    repo: redrob-cowork
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Redrob Cowork uses the microphone when you start Voice Mode so you can speak commands to your agent.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - redrob
        - redrob-aarch64-apple-darwin
        - redrob-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "Redrob Cowork Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/linux
  syncDesktopName: true
  extraResources:
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - redrob
        - redrob-aarch64-unknown-linux-gnu
        - redrob-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  signtoolOptions:
    # electron-builder defaults `signingHashAlgorithms` to ["sha1", "sha256"] and
    # runs ONE SIGNING PASS PER ENTRY, so the default doubles every signature a
    # cloud signing service bills us for. sha1 buys nothing back: Microsoft let
    # the SHA-1 Trusted Root CA expire on 2021-05-09, so the chain a sha1
    # Authenticode signature needs is no longer publicly trusted, and the only
    # platform it ever served -- Windows 7 SP1 without the 2019 SHA-2 servicing
    # update -- cannot run this Electron version anyway.
    signingHashAlgorithms:
      - sha256
    # Azure Artifact Signing over OpenID Connect, through the ONE shared recipe:
    # the hook hands each file to redrob-labs/.github's
    # actions/sign-windows/sign.ps1 (checked out at .redrob-shared by the release
    # workflow), authenticated by the `az login` the release job performs right
    # before packaging. No certificate file or secret exists. The hook skips a
    # vendor binary (elevate.exe, Microsoft's OpenConsole.exe) that already
    # carries its own signature, since cloud signing bills per signature. See
    # build/sign-windows.cjs.
    sign: build/sign-windows.cjs
    # electron-updater installs an update only when the installer's signer
    # matches this name (written into app-update.yml). electron-builder reads it
    # from the certificate file when there is one; with Artifact Signing there
    # is none, so the organization's Public Trust certificate is named here.
    publisherName: 'CN="McKinley Rice, Inc."'
  extraResources:
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/sidecars
      to: sidecars
      filter:
        - redrob.bin
        - redrob-aarch64-pc-windows-msvc.bin
        - redrob-x86_64-pc-windows-msvc.bin
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.bin
        - versions.json-x86_64-pc-windows-msvc.bin
  target:
    - nsis
    # The unpacked app as a zip. Redrob Launcher cannot run an NSIS installer, so this is the
    # Windows package it installs (renamed to -portable.zip by launcher-asset-names.mjs).
    - zip
nsis:
  include: build/installer.nsh
  # electron-builder defaults to a one-click installer that starts writing the
  # moment it opens, with no destination and no confirmation. Redrob Office ships
  # the assisted installer, and an app that installs itself before the user has
  # agreed to anything reads as malware rather than as a shortcut.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user by default, so no UAC prompt is needed for the common case.
  perMachine: false
  # uiux-refresh round 3 (presentation only): the redesigned installer UI. The warm copy,
  # the install status metaphors and the uninstaller feedback page live in build/installer.nsh;
  # the branded Welcome/Finish sidebar bitmaps are build/installerSidebar.bmp +
  # build/uninstallerSidebar.bmp (see build/README-installer-art.md). Name the entry warmly in
  # Add/Remove Programs too.
  uninstallDisplayName: Redrob Cowork
  # Enable these once the branded 164x314 24-bit BMPs are exported into build/ (they would
  # otherwise fail packaging if referenced while missing). See build/README-installer-art.md.
  # installerSidebar: build/installerSidebar.bmp
  # uninstallerSidebar: build/uninstallerSidebar.bmp
