name: Promote Release Assets to CDN

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing stable release version to promote (for example 0.0.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: work-cdn-promote-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote existing v${{ inputs.version }} assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download existing GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          mkdir -p apps/desktop/dist-electron
          gh release download "v${version}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir apps/desktop/dist-electron
          printf 'Downloaded %s existing assets; no product build ran.\n' \
            "$(find apps/desktop/dist-electron -maxdepth 1 -type f | wc -l)"

      - name: Verify promotion contract
        run: node --test scripts/cdn.test.mjs scripts/promote-release-to-cdn.test.mjs

      - name: Promote release assets to cdn.redrob.ai
        env:
          REDROB_WORK_CDN_VERSION: ${{ inputs.version }}
          REDROB_WORK_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
          REDROB_WORK_CDN_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
          REDROB_WORK_CDN_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
          REDROB_WORK_CDN_PREFIX: work
          REDROB_WORK_CDN_LATEST: "1"
        run: node scripts/promote-release-to-cdn.mjs

      - name: Verify public CDN
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          for path in \
            "${version}/version.json" \
            "${version}/latest-mac.yml" \
            "latest/version.json" \
            "latest/latest-mac.yml" \
            "latest/latest-linux-arm64.yml" \
            "latest/latest-linux.yml" \
            "latest/latest.yml" \
            "latest/redrob-linux-arm64.AppImage" \
            "latest/redrob-linux-x64.AppImage" \
            "latest/redrob-work-arm64-setup.exe" \
            "latest/redrob-work-x64-setup.exe" \
            "latest/redrob-work-mac-arm64.dmg" \
            "latest/redrob-work-mac-x64.dmg" \
            "latest/redrob-work-mac-arm64.dmg.sha256"; do
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --output /dev/null "https://cdn.redrob.ai/work/${path}"
          done
