name: i18n Audit

on:
  # No branch filter: these are required checks, so a filter that misses the
  # target branch would leave a pull request waiting on a check that never runs.
  pull_request:
  push:
    branches:
      - main
      - trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n-audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run i18n audit
        run: node scripts/i18n-audit.mjs --ci
