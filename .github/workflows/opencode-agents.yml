name: Opencode Agents

on:
  workflow_dispatch:
    inputs:
      target:
        description: Run issue triage or duplicate PR check
        required: true
        type: choice
        options:
          - issue
          - pull_request
      number:
        description: Issue or pull request number
        required: true
        type: number

jobs:
  triage-issue:
    if: inputs.target == 'issue'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Redrob Code engine
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/redrob-code"
          rm -rf "$install_dir"
          node apps/desktop/scripts/prepare-sidecar.mjs --outdir "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Triage issue
        env:
          REDROB_API_KEY: ${{ secrets.REDROB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.number }}
        run: |
          # An absent secret arrives as an empty string, so without this the engine runs keyless and
          # the failure surfaces as a confusing model or auth error inside the agent run rather than
          # as the missing configuration it is.
          if [ -z "${REDROB_API_KEY:-}" ]; then
            echo "::error::REDROB_API_KEY is not set. This job runs the Redrob Code engine against the console, which needs a console API key. Add REDROB_API_KEY as a repository secret (Settings > Secrets and variables > Actions) or as a redrob-labs organization secret shared with this repository." >&2
            exit 1
          fi
          cat > /tmp/issue_prompt.txt <<'PROMPT_EOF'
          The following issue was just opened, triage it:
          PROMPT_EOF
          ISSUE_TITLE="$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)"
          ISSUE_BODY="$(gh issue view "$ISSUE_NUMBER" --json body --jq .body)"
          printf '\nTitle: %s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" >> /tmp/issue_prompt.txt
          redrob run --agent triage "$(cat /tmp/issue_prompt.txt)"

  duplicate-prs:
    if: inputs.target == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Redrob Code engine
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/redrob-code"
          rm -rf "$install_dir"
          node apps/desktop/scripts/prepare-sidecar.mjs --outdir "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Build prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.number }}
        run: |
          {
            echo "Check for duplicate PRs related to this new PR:"
            echo ""
            echo "CURRENT_PR_NUMBER: $PR_NUMBER"
            echo ""
            echo "Title: $(gh pr view \"$PR_NUMBER\" --json title --jq .title)"
            echo ""
            echo "Description:"
            gh pr view "$PR_NUMBER" --json body --jq .body
          } > pr_info.txt

      - name: Check for duplicate PRs
        env:
          REDROB_API_KEY: ${{ secrets.REDROB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.number }}
        run: |
          # An absent secret arrives as an empty string, so without this the engine runs keyless and
          # the failure surfaces as a confusing model or auth error inside the agent run rather than
          # as the missing configuration it is.
          if [ -z "${REDROB_API_KEY:-}" ]; then
            echo "::error::REDROB_API_KEY is not set. This job runs the Redrob Code engine against the console, which needs a console API key. Add REDROB_API_KEY as a repository secret (Settings > Secrets and variables > Actions) or as a redrob-labs organization secret shared with this repository." >&2
            exit 1
          fi
          redrob run --agent duplicate-pr "$(cat pr_info.txt)" > /tmp/comment_output.txt

          {
            echo "_The following comment was made by an LLM, it may be inaccurate:_"
            echo ""
            cat /tmp/comment_output.txt
          } > /tmp/comment_body.txt
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment_body.txt
