name: route-labeller

# @redrob-labs/route-labeller is consumed outside this repository - by Redrob Office and Redrob Design -
# so it is published to npm, the same way redrob-ui-mcp is: checked on every pull request, published
# when a `route-labeller-v*` tag is pushed. Not a required check.

on:
  pull_request:
    paths:
      - "packages/route-labeller/**"
      - ".github/workflows/ci-route-labeller.yml"
  push:
    branches:
      - main
    tags:
      - "route-labeller-v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/route-labeller

jobs:
  check:
    name: Types, build & dry-run publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Types
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # The accuracy bar the labeller ships at: top-1 and top-3 on held-out sentences in en, ko, hi.
      # Needs the model (about 140 MB, verified against the pinned manifest).
      - name: Fetch the route model
        run: pnpm model
      - name: Evaluate
        run: pnpm eval
      - name: Dry-run publish
        run: npm publish --dry-run --access public

  publish:
    name: Publish to npm
    needs: check
    if: startsWith(github.ref, 'refs/tags/route-labeller-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm build
      - name: Assert package.json version matches the tag
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#route-labeller-v}"
          have="$(node -p "require('./package.json').version")"
          [ "$want" = "$have" ] || { echo "::error::tag says $want, package.json says $have"; exit 1; }
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
