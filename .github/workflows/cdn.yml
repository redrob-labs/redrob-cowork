# Publish the desktop distributables to https://cdn.redrob.ai/work/.
#
# The Redrob Code engine sidecar this pack bundles comes from the public Code CDN
# (https://cdn.redrob.ai/code/), verified against its published sha256 sidecar, so
# no credential is needed to build a runnable app here.
#
# The Linux AppImage and tarball built here are UNSIGNED: a plain ubuntu-latest
# runner has no Linux code-signing identity, and the download page must not imply
# otherwise. macOS notarization is skipped (Apple certificates live on the
# release workflow). Windows NSIS is signed on windows-latest with the
# organization secrets WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (electron-builder
# CSC_LINK / CSC_KEY_PASSWORD). A repository secret of the same name overrides
# the org value; do not recreate them on this repo.
#
# The upload is gated on the CDN bucket and credentials being present. When they
# are not, scripts/cdn.mjs prints which variable is missing and exits 0, so an
# unprovisioned CDN never reddens this build. There is no GitHub Releases
# fallback. The credentials carry s3:PutObject only, so the only verification of
# a published key is an HTTP GET through CloudFront.
name: cdn

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish under, e.g. 0.3.1. Empty publishes a commit-stamped preview and leaves latest/ alone."
        required: false
        type: string
  push:
    paths:
      - .github/workflows/cdn.yml

permissions:
  contents: read

jobs:
  cdn:
    # Only the canonical repository owns the shared bucket's credentials; forks
    # carry neither the secrets nor a reason to publish.
    if: github.repository == 'redrob-labs/redrob-work'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      # The workspace commits `0.0.0-dev` on purpose and the release workflows
      # stamp the real version in at build time, so this job has to decide one
      # too or electron-builder would name every artifact `-0.0.0-dev` and the
      # CDN would carry that as a version prefix. A dispatch with a version is a
      # publish; anything else is a preview stamped with the commit, which gets
      # its own prefix and must not move `latest/` to something nobody released.
      - name: Resolve the version to publish
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "latest=1" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-cdn.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "latest=0" >> "$GITHUB_OUTPUT"
          fi

      # pnpm must be installed BEFORE setup-node so setup-node can find the pnpm
      # binary on PATH, matching this repo's other workflows.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the version into the workspace
        run: node scripts/release/stamp-version.mjs --version "${{ steps.version.outputs.version }}"

      - name: Verify the CDN uploader and the engine sidecar fetch
        run: |
          set -euo pipefail
          node --test scripts/cdn.test.mjs
          node --test apps/desktop/scripts/redrob-code-cdn.test.mjs

      # The desktop app bundles the Redrob Code engine as a sidecar.
      # prepare-sidecar.mjs fetches it from the public Code CDN
      # (https://cdn.redrob.ai/code/) and verifies the published sha256 sidecar,
      # so this job needs no credentials to produce a runnable distributable.
      # REDROB_GITHUB_TOKEN stays wired as the secondary source for targets the
      # CDN does not publish; when it is absent the CDN path is the only one and
      # a failure there is a real failure that reddens the build.
      - name: Build the Linux distributable (unsigned)
        env:
          REDROB_GITHUB_TOKEN: ${{ secrets.REDROB_GITHUB_TOKEN }}
          REDROB_CODE_GITHUB_REPO: ${{ vars.REDROB_CODE_GITHUB_REPO || 'redrob-labs/redrob-code' }}
          REDROB_DESKTOP_SENTRY_DSN: ${{ secrets.REDROB_DESKTOP_SENTRY_DSN || vars.REDROB_DESKTOP_SENTRY_DSN }}
          REDROB_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.REDROB_DESKTOP_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
          # No Linux signing identity exists on a plain runner; make the absence
          # explicit rather than letting electron-builder probe for one.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          pnpm --filter @redrob/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            --linux AppImage tar.gz \
            --publish never

      - name: Publish to cdn.redrob.ai
        env:
          REDROB_WORK_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
          REDROB_WORK_CDN_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
          REDROB_WORK_CDN_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
          REDROB_WORK_CDN_PREFIX: work
          REDROB_WORK_CDN_TARGETS: linux
          # A preview publishes under its own commit-stamped prefix and leaves
          # `latest/` pointing at the last real release.
          REDROB_WORK_CDN_LATEST: ${{ steps.version.outputs.latest }}
        run: node scripts/cdn.mjs

  windows:
    # Signed NSIS on a Windows runner. Same version/latest gate as the Linux job:
    # a dispatch with a version may move latest/; a path-push preview must not.
    if: github.repository == 'redrob-labs/redrob-work'
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Resolve the version to publish
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "latest=1" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-cdn.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "latest=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the version into the workspace
        shell: bash
        run: node scripts/release/stamp-version.mjs --version "${{ steps.version.outputs.version }}"

      - name: Require Windows signing certificate
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK) { throw "Missing WIN_CSC_LINK organization secret" }
          if (-not $env:CSC_KEY_PASSWORD) { throw "Missing WIN_CSC_KEY_PASSWORD organization secret" }

      - name: Build the Windows installer (signed)
        env:
          REDROB_GITHUB_TOKEN: ${{ secrets.REDROB_GITHUB_TOKEN }}
          REDROB_CODE_GITHUB_REPO: ${{ vars.REDROB_CODE_GITHUB_REPO || 'redrob-labs/redrob-code' }}
          REDROB_DESKTOP_SENTRY_DSN: ${{ secrets.REDROB_DESKTOP_SENTRY_DSN || vars.REDROB_DESKTOP_SENTRY_DSN }}
          REDROB_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.REDROB_DESKTOP_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
        run: |
          pnpm --filter @redrob/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis --x64 --publish never

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/dist-electron/redrob-win-x64-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Signed installer was not produced" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if (-not $signature.SignerCertificate) {
            throw "Installer has no Authenticode signer certificate"
          }
          $accepted = @("Valid", "UnknownError", "NotTrusted")
          if ($accepted -notcontains $signature.Status.ToString()) {
            throw "Invalid Authenticode signature: $($signature.Status) ($($signature.StatusMessage))"
          }
          Write-Host "Signed by: $($signature.SignerCertificate.Subject) status=$($signature.Status)"

      - name: Publish to cdn.redrob.ai
        env:
          REDROB_WORK_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
          REDROB_WORK_CDN_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
          REDROB_WORK_CDN_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
          REDROB_WORK_CDN_PREFIX: work
          REDROB_WORK_CDN_TARGETS: windows
          REDROB_WORK_CDN_LATEST: ${{ steps.version.outputs.latest }}
        run: node scripts/cdn.mjs
