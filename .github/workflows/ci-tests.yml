name: Redrob Work Tests

# Paused during local-dev. Restore pull_request/push on `dev` to re-enable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redrob-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2204, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install Redrob Code engine
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/redrob-code"
          rm -rf "$install_dir"
          node apps/desktop/scripts/prepare-sidecar.mjs --outdir "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify Redrob Code
        run: redrob --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run app unit tests
        run: pnpm --filter @redrob/app test

      - name: Run server unit tests
        run: pnpm --filter redrob-server test

      - name: Run desktop unit tests
        run: pnpm --filter @redrob/desktop test

      - name: Run release script tests
        run: node --test scripts/release/*.test.mjs

      - name: Check outbound access manifest
        run: pnpm check:outbound-access

      # The packaged builds bundle the server plugins with `--target node`,
      # which resolves workspace packages through their published exports
      # rather than TypeScript paths. Typechecks and bun tests never take that
      # route, so an unbuildable import reached dev twice before this ran here.
      - name: Bundle the server plugins the way packaged builds do
        run: |
          set -euo pipefail
          rm -rf packages/types/dist
          pnpm --filter redrob-server build

      - name: Typecheck Electron main against the IPC contract
        run: pnpm --filter @redrob/desktop typecheck:electron

      - name: Run e2e tests
        run: pnpm --filter @redrob/app test:e2e

  # Single stable context for branch rulesets to require. Green only when
  # every redrob-tests matrix leg succeeded; runs even when legs fail or
  # are cancelled so the required check always reports instead of hanging.
  redrob-tests-required:
    needs: redrob-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every redrob-tests matrix leg to pass
        env:
          RESULT: ${{ needs.redrob-tests.result }}
        run: |
          echo "redrob-tests result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "One or more Redrob Work Tests matrix legs did not succeed; blocking merge." >&2
            exit 1
          fi
