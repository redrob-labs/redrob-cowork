# The one pull-request CI: a seconds-long scripts job and one compile job named "tests"
# (typecheck only on pull requests; skipped for docs-only and version-only pull requests).
# Unit tests run only on a by-hand workflow_dispatch run.
# No push or schedule triggers. Releases live in release-macos-aarch64.yml.

name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Docs-only and version-only pull requests skip the tests job. A skipped job still satisfies
  # the required "tests" check, so branch protection needs no change.
  changes:
    name: changes
    runs-on: ubuntu-22.04
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "heavy=true" | tee -a "$GITHUB_OUTPUT"; exit 0; fi
          heavy=false
          version_line='^[+-][[:space:]]*("version"[[:space:]]*:|version[[:space:]]*=)[[:space:]]*"[^"]*",?[[:space:]]*$'
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*|LICENSE*|CHANGELOG*) continue ;;
              VERSION|*/VERSION|REDROB_VERSION|*-version.txt) continue ;;
              package.json|*/package.json|Cargo.toml|*/Cargo.toml|package-lock.json)
                if git diff -U0 "$BASE" HEAD -- "$f" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
                    | grep -qvE "$version_line"; then
                  heavy=true; break
                fi
                continue ;;
            esac
            heavy=true; break
          done < <(git diff --name-only "$BASE" HEAD)
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: i18n audit
        run: node scripts/i18n-audit.mjs --ci

      - name: Retired product name is gone
        run: node scripts/check-brand.mjs

      - name: Shipped modules parse
        run: node scripts/check-syntax.mjs

      - name: redrob-ui-mcp syntax + dry-run publish
        working-directory: packages/redrob-ui-mcp
        run: |
          node --check index.mjs
          npm publish --dry-run --access public

  tests:
    name: tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck (web UI)
        run: pnpm typecheck

      - name: Typecheck (desktop electron)
        run: pnpm --filter @redrob/desktop typecheck:electron

      - name: Desktop bridge check
        run: pnpm --filter @redrob/desktop check:electron

      # Pull requests compile once; the release build compiles again. Tests run by hand
      # (workflow_dispatch) only.
      - name: Unit tests
        if: github.event_name != 'pull_request'
        run: pnpm test
